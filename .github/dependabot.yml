version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/bindings/js/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/bindings/python/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/core/"
    schedule:
      interval: "weekly"
