[package]
name = "enhex_core"
version = "0.2.0"
edition = "2021"
description = "EnhEx core engine - compiles Enhanced Expressions to Regex"
license = "MIT"
repository = "https://github.com/mkh-user/enhex"
keywords = ["regex", "dsl", "enhex", "pattern", "compiler"]
categories = ["command-line-utilities", "parsing", "text-processing"]

[dependencies]
# wasm-bindgen = "0.2"
thiserror = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
